# Network-volume endpoint. The platform comparison, not the deliverable.
#
#   python scripts/apply_endpoint.py --config deploy/endpoints/volume.yaml \
#     --tag 0.1.0-<sha>-volume
#
# Identical to baked.yaml except where marked. Keeping them diffable is the
# point: any difference other than the weight path would mean the benchmark in
# docs/specs/09-benchmarks.md is measuring two variables at once.

name: flux-worker-volume
image_repository: ghcr.io/OWNER/flux-worker

gpu_types:
  - NVIDIA L40S
  - NVIDIA A100 80GB PCIe

workers:
  min: 0
  max: 3

idle_timeout_s: 60
execution_timeout_ms: 300000
flashboot: true

# Scale up when a job waits longer than this many seconds.
scaler_type: QUEUE_DELAY
scaler_value: 4

# The CUDA-wheel / host-driver pairing. uv.lock resolves torch with cu130
# wheels, which need CUDA-13-capable hosts; declaring it here fails fast on
# scheduling instead of at model load, and is the one-line fix if the first
# deploy lands on older drivers. Widen this only after repinning torch.
allowed_cuda_versions:
  - "13.0"
  - "12.9"
  - "12.8"

# Disk for the image plus working space. The image is ~2.9GB.
container_disk_gb: 20
concurrency_modifier: 1

# DIFFERENCE: the volume holds the weights, and pins this endpoint to one
# datacenter. That narrows the GPU pool — and it narrows precisely when
# scaling up under load, which is when the volume was supposed to help.
network_volume_id: REPLACE_WITH_VOLUME_ID
datacenters:
  - US-KS-2   # must match the volume's datacenter

env:
  WEIGHTS_PATH: /runpod-volume/flux   # DIFFERENCE: mounted, not baked
  LOG_LEVEL: INFO
