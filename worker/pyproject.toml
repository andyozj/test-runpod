[project]
name = "worker"
version = "0.1.0"
description = "RunPod serverless worker for FLUX.1-dev text-to-image"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "pillow>=10.4",
    "runpod>=1.7",
]

# Installed only in the image. Excluded from the dev environment so the test
# suite stays importable without a GPU or a multi-gigabyte download, which is
# the constraint STANDARDS.md section 9 exists to protect.
[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
    "protobuf>=5.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "huggingface-hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
    "D",
    "T20",
    "S",
    "C90",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]
ignore = [
    "E501",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D", "S101", "PLR2004"]
"scripts/**" = ["T20"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["diffusers.*", "runpod.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not gpu' --strict-markers"
markers = ["gpu: requires a live GPU or deployed endpoint"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/worker"]
