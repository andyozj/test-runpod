# Lints the CLI tools, which sit outside both packages: client/ and scripts/.
# Each package has its own config in its pyproject.toml.

line-length = 88
target-version = "py311"
include = ["client/**/*.py", "scripts/**/*.py"]

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "D", "S", "C90", "PLR0913"]
# T20 is deliberately absent: these are command-line tools, and stdout is the
# interface. Everything else in STANDARDS.md applies.
ignore = ["E501", "D107"]

[lint.mccabe]
max-complexity = 12

[lint.pydocstyle]
convention = "google"
