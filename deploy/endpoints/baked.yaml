# Baked-weights endpoint. Documented fallback, not deployed: the image
# contains the handler and the model, which is the artefact the brief names.
#
# Also the fallback if the model store misbehaves — a different tag and
# this file, with no infrastructure to provision.
#
# Applied with:
#   python scripts/apply_endpoint.py --config deploy/endpoints/baked.yaml \
#     --tag 0.1.0-<sha>-baked
#
# Values here are the source of truth. "Why is idle timeout 60s?" must be
# answerable from this repository, not from someone's browser history.

name: flux-worker-baked
image_repository: ghcr.io/andyozj/flux-worker

gpu_pools:
  # Ordered by preference. REST v2 selects by pool, not model: ADA_48_PRO =
  # L40/L40S/6000 Ada (48GB), AMPERE_80 = A100 80GB. bf16 FLUX needs ~24-26GB
  # steady, so 24GB pools are excluded: too tight to be safe at 1024² and above.
  - ADA_48_PRO
  - AMPERE_80

workers:
  min: 0            # scale to zero; this is a demo endpoint, not a service
  max: 3            # enough to demonstrate concurrency and queueing

idle_timeout_s: 60  # long enough that a demo sequence stays warm. Billed while
                    # idling, so this is a real cost, not a free convenience.
execution_timeout_ms: 300000   # above worst case 50 steps at 1536²
flashboot: true

# Scale up when a job waits longer than this many seconds.
scaler_type: QUEUE_DELAY
scaler_value: 4

# REST v2 has no allowedCudaVersions filter (verified against
# api.runpod.io/v2/openapi.json, 2026-08-09). uv.lock resolves torch with
# cu130 wheels, which need CUDA-13-capable hosts; a mismatch now fails at
# model load, not at scheduling. The fix if that bites is repinning torch to
# cu12x wheels and rebuilding.

# Disk for the image plus working space. The BAKED image is ~45GB — this
# value must exceed it or the container can never pull.
container_disk_gb: 60

# GPU-bound. A second concurrent job causes VRAM contention, not throughput.
concurrency_modifier: 1

env:
  WEIGHTS_PATH: /opt/weights
  # Secrets are references, never values — this file is committed.
  # HF_TOKEN is a build-time BuildKit secret and is not needed at runtime.
