# Cached-models endpoint. RunPod pre-stages the HuggingFace repo on host
# machines before a worker starts, preferring hosts that already hold it.
#
#   python scripts/apply_endpoint.py --config deploy/endpoints/cached.yaml \
#     --tag 0.1.0-<sha>-slim
#
# Runs the ~2.9GB slim image: no weights baked in, and the worker resolves them
# from the cache because WEIGHTS_PATH is unset. No code change.
#
# Shipped 2026-08 ("model store"); config is console-only for the Model
# field. If it misbehaves the fallback is baked.yaml, which needs no new
# infrastructure — a different tag and a different config file.
#
# No network volume and no datacenter pin: nothing here provisions storage, so
# the endpoint runs wherever there is capacity.

name: flux-worker-cached
image_repository: ghcr.io/andyozj/flux-worker

# L40S only, by decision 2026-08-06: one GPU type keeps every measured number
# on one card. The cost is queueing instead of falling back when L40S is
# scarce — re-add "NVIDIA A100 80GB PCIe" here if that bites.
gpu_types:
  - NVIDIA L40S

workers:
  min: 0
  max: 3

idle_timeout_s: 60
execution_timeout_ms: 300000
flashboot: true

# Scale up when a job waits longer than this many seconds.
scaler_type: QUEUE_DELAY
scaler_value: 4

# The CUDA-wheel / host-driver pairing. uv.lock resolves torch with cu130
# wheels, which need drivers from CUDA 13 hosts — a 12.x host fails CUDA init
# at model load. Declaring it here fails fast at scheduling instead. If the
# 13.0 pool proves too small, the fix is repinning torch to cu12x wheels and
# widening this list in the same commit; listing 12.x now would defeat the
# filter's purpose.
allowed_cuda_versions:
  - "13.0"

# Disk for the image plus working space. The image is ~2.9GB.
container_disk_gb: 20
concurrency_modifier: 1

# Set in the endpoint's Model field, not here: RunPod stages this repo and
# needs an HF token because FLUX.1-dev is gated.
#   Model:     black-forest-labs/FLUX.1-dev
#   HF token:  a read token with the licence accepted
cached_model: black-forest-labs/FLUX.1-dev

env:
  # Deliberately unset so the worker falls through to MODEL_CACHE_ROOT.
  # WEIGHTS_PATH: unset
  MODEL_CACHE_ROOT: /runpod-volume/huggingface-cache/hub
  LOG_LEVEL: INFO
  # Belt and braces per RunPod's docs: even though the pipeline already passes
  # local_files_only=True, these stop any library reaching for the network at
  # load time — which on a cold worker would look like a slow start rather
  # than a misconfiguration.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
