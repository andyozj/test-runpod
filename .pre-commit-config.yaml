repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(worker|gateway)/
      - id: ruff-format
        files: ^(worker|gateway)/

  - repo: local
    hooks:
      - id: mypy-worker
        name: mypy (worker)
        entry: bash -c 'cd worker && uv run mypy src/'
        language: system
        pass_filenames: false
        files: ^worker/
